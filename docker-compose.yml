services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: minh-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: minh
      POSTGRES_PASSWORD: minh_dev
      POSTGRES_DB: minh
    volumes:
      - minh_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minh"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minh_pgdata:
