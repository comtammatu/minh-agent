name: Pipeline Performance Budget

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  pipeline-performance-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVE_EXCHANGE: HL
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Performance Budget Gate
        run: bun run bench:pipeline:ci
