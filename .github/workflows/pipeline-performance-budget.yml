name: Pipeline Performance Budget

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pipeline-performance-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVE_EXCHANGE: HL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Performance Budget Gate
        run: bun run bench:pipeline:ci
